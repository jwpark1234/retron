<!doctype html><html><head><meta charset="utf-8"><style>
/* 아이콘: 랜딩 로고와 같은 글꼴·같은 O 스타일 (src/style.css의 .logo em) */
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
.screen{position:relative;width:100vw;height:100vh;border-radius:var(--r,0);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(72% 72% at 50% 46%,#211d19,#0e0d0c 65%,#040404);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em}
em{font-style:normal;display:inline-block;color:transparent;font-size:84vh;line-height:.82;padding:.1em 0;margin:-.1em 0;transform:translateY(-0.02em);
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.38) 0 .032em,transparent .032em .082em),linear-gradient(180deg,#ffcf72,#ffb340 50%,#ff8a1e);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(-.018em 0 0 rgba(255,42,16,.55)) drop-shadow(.018em 0 0 rgba(30,200,255,.35)) drop-shadow(0 0 .09em rgba(255,154,46,.75))}
/* 화면 전체 주사선, 가장자리 어둡게, 유리 반사 */
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%),radial-gradient(74% 74% at 50% 50%,transparent 55%,rgba(0,0,0,.8)),repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1.05%,transparent 1.05% 2.5%)}
</style></head><body><div class="screen" id="s"><em id="i">O</em></div>
<script>
// #round: 둥근 모서리 (파비콘, 아이콘). #maskable: 안드로이드가 동그랗게·둥글게 깎아도 O가 남도록 O를 작게 (가운데 80% 원 안)
if(location.hash==="#round")document.getElementById("s").style.setProperty("--r","22.6%");
if(location.hash==="#maskable")document.getElementById("i").style.fontSize="60vh";
</script></body></html>
