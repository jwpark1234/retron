<!doctype html><html><head><meta charset="utf-8"><style>
/* 아이콘: 주황 바탕에 흰 고리. 로고(src/ui/Logo.tsx)의 O 자리 고리와 같은 모양. 주사선·번짐 같은 효과는 쓰지 않는다 */
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
.bg{width:100vw;height:100vh;border-radius:var(--r,0);display:grid;place-items:center;background:linear-gradient(180deg,#ffbf55,#ff9a2a)}
/* 고리 두께는 로고와 같은 비율 (지름 0.66em, 두께 0.15em) */
.ring{--d:var(--size,54vh);width:var(--d);height:var(--d);box-sizing:border-box;border:calc(var(--d)*.227) solid #fff;border-radius:50%}
</style></head><body><div class="bg" id="s"><div class="ring" id="i"></div></div>
<script>
// #round: 둥근 모서리 (파비콘, 아이콘). #maskable: 안드로이드가 동그랗게·둥글게 깎아도 고리가 남도록 작게 (가운데 80% 원 안)
if(location.hash==="#round")document.getElementById("s").style.setProperty("--r","22.6%");
if(location.hash==="#maskable")document.getElementById("i").style.setProperty("--size","44vh");
</script></body></html>
