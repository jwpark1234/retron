<!doctype html><html><head><meta charset="utf-8"><style>
/* 아이콘: 어두운 브라운관 화면 속 RETRON 로고 (src/style.css의 .logo와 같은 글꼴·같은 CRT 효과).
   창을 정사각형으로 맞춰 찍는다. 주사선은 창 크기 비율(vh)로 그려 크기마다 같은 모양이 나온다 */
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
.screen{position:relative;width:100vw;height:100vh;border-radius:var(--r,0);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(72% 72% at 50% 46%,#211d19,#0e0d0c 65%,#040404);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:.82;font-weight:800;letter-spacing:-.01em;font-size:24.5vh;transform:translate(.01em,.03em)}
.logo>span{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0 .7vh,transparent .7vh 1.9vh),linear-gradient(180deg,#fff,#ecebe6 55%,#c9c6bf);
  filter:drop-shadow(-.016em 0 0 rgba(255,42,16,.6)) drop-shadow(.016em 0 0 rgba(30,200,255,.5)) drop-shadow(0 0 .1em rgba(225,235,255,.3))}
.logo em{font-style:normal}
.logo em i{font-style:normal;display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;padding:.1em 0;margin:-.1em 0;
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0 .7vh,transparent .7vh 1.9vh),linear-gradient(180deg,#ffcf72,#ffb340 50%,#ff8a1e);
  filter:drop-shadow(0 0 .09em rgba(255,154,46,.85))}
.logo .n{margin-top:.02em}
/* 화면 전체 주사선, 가장자리 어둡게, 유리 반사 */
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 45%),radial-gradient(74% 74% at 50% 50%,transparent 58%,rgba(0,0,0,.75)),repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1.05%,transparent 1.05% 2.5%)}
</style></head><body><div class="screen" id="s"><span class="logo"><span>RETR<em><i>O</i></em></span><span class="n">N</span></span></div>
<script>if(location.hash==="#round")document.getElementById("s").style.setProperty("--r","22.6%")</script></body></html>
