<!doctype html>
<!--
  첫 화면 배경(public/landing-bg.jpg): 유명한 고전 게임 화면을 한 장씩 CRT를 씌워 겹쳐 깐 콜라주.
  화면 그림은 위키백과 게임 문서의 스크린샷을 받아 쓴다 (저장소에는 넣지 않는다. 받는 법·목록은 README.md).
  1920×1200 창에서 열고 build(그림 주소 배열)을 부른 뒤, 제목이 done이 되면 찍어서 JPG(품질 72)로 저장한다.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="out" width="1920" height="1200"></canvas>
<script>
const TW = 300, TH = 225; // 화면 하나 (4:3)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// CRT를 씌운 화면 하나: 화면을 꽉 채우게 잘라 픽셀 그대로 키우고 + RGB 어긋남 + 주사선 + 가장자리 어둡게 + 유리 반사 + 둥근 모서리
function crtTile(img) {
  const c = document.createElement("canvas"); c.width = TW; c.height = TH;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = img.naturalWidth < 600 ? false : true;
  g.beginPath(); g.roundRect(0, 0, TW, TH, 18); g.clip();
  const k = Math.max(TW / img.naturalWidth, TH / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
  const x = (TW - w) / 2, y = img.naturalHeight > img.naturalWidth * 1.4 ? 0 : (TH - h) / 2; // 세로로 긴 그림(두 화면을 붙인 것)은 윗화면
  g.fillStyle = "#000"; g.fillRect(0, 0, TW, TH);
  g.drawImage(img, x, y, w, h);
  g.globalCompositeOperation = "screen"; g.globalAlpha = 0.22; g.drawImage(img, x - 2, y, w, h); g.drawImage(img, x + 2, y, w, h);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  g.fillStyle = "rgba(0,0,0,.38)"; for (let yy = 0; yy < TH; yy += 3) g.fillRect(0, yy + 2, TW, 1);
  const v = g.createRadialGradient(TW / 2, TH / 2, TH * 0.3, TW / 2, TH / 2, TW * 0.62); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.7)"); g.fillStyle = v; g.fillRect(0, 0, TW, TH);
  const s = g.createLinearGradient(0, 0, 0, TH * 0.5); s.addColorStop(0, "rgba(255,255,255,.1)"); s.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = s; g.fillRect(0, 0, TW, TH);
  return c;
}

const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(src)); i.src = src; });

// 뒤죽박죽 콜라주: 그림마다 한 번씩만. 자리는 9×5 칸에서 크게 흔들고, 크기·기울기는 제각각, 겹치는 순서도 섞는다.
// 칸을 기준으로 흔들어서 화면 전체가 고르게 덮인다 (빈 곳이 크게 생기지 않게)
window.build = async (srcs) => {
  const imgs = await Promise.all(srcs.map(load));
  const tiles = imgs.map(crtTile);
  const COLS = 9, ROWS = 5, CW = 1920 / COLS, CH = 1200 / ROWS;
  const spots = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    spots.push({
      x: (c + 0.5) * CW + (rnd() - 0.5) * CW * 0.9,
      y: (r + 0.5) * CH + (rnd() - 0.5) * CH * 0.9,
      s: 0.7 + rnd() * 0.75, // 0.7 ~ 1.45배
      a: (rnd() - 0.5) * 0.65, // -19° ~ 19°
    });
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; } // 겹치는 순서
  const out = document.getElementById("out"), o = out.getContext("2d");
  o.fillStyle = "#07070c"; o.fillRect(0, 0, out.width, out.height);
  spots.forEach((p, i) => {
    o.save(); o.translate(p.x, p.y); o.rotate(p.a); o.scale(p.s, p.s);
    o.shadowColor = "rgba(0,0,0,.8)"; o.shadowBlur = 28; o.drawImage(tiles[i % tiles.length], -TW / 2, -TH / 2); o.restore();
  });
  document.title = "done";
};
</script></body></html>
